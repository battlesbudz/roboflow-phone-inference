name: export-rfdetr

# One-off export: RF-DETR Nano (Roboflow) -> ONNX, dynamically quantized
# to int8, committed to the branch. Normally manual dispatch ONLY --
# never on push. The export runs export_rfdetr.py, which uses Roboflow's
# own rfdetr code to export the official COCO checkpoint (fp32),
# quantizes it with ONNX Runtime's own quantize_dynamic, verifies
# fp32/quantized parity on test-bus.jpg, and writes
# RFDETR_PROVENANCE.json. This job then commits rf-detr-nano.onnx + the
# provenance file to the branch.
#
# Why the model is committed from the runner instead of pushed via the
# API: the ONNX is tens of MB, far over the Contents API's practical
# payload limits. The runner pushes with GITHUB_TOKEN instead.

on:
  workflow_dispatch:
# 2026-10-14: re-run for the fp16 boundary-Cast fix in export_rfdetr.py.
# 2026-10-14: re-run for shape-inference value_info refresh after Cast surgery.
# 2026-10-14: pivot fp16 -> INT8 QDQ (fp16 converter graph rejected by ORT).
# 2026-10-15: pivot INT8 QDQ -> ORT dynamic quantization. rfdetr's
# export() quantization parameter is TFLite-only and ignored for ONNX,
# so the INT8 run silently produced a plain 115 MB fp32 file.
# 2026-10-15: push trigger removed; export landed, workflow is dispatch-only.
# 2026-10-15: TEMPORARY push trigger restored for the ConvInteger
# re-export (MatMul-only quantization). Removed after it landed
# (run 38673123516); workflow is dispatch-only again.

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-onnx-app
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rfdetr + onnxruntime
        run: |
          pip install "rfdetr==1.9.1" onnx onnxruntime Pillow numpy

      - name: Export + verify + write provenance
        run: python export_rfdetr.py

      - name: Commit model + provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rf-detr-nano.onnx RFDETR_PROVENANCE.json
          git status --short
          git commit -m "Bundle RF-DETR Nano (Roboflow) ONNX, MatMul-only dynamic quantization + provenance

          Re-export for the 2026-10-15 phone load failure
          (ORT_NOT_IMPLEMENTED ConvInteger): quantize_dynamic now uses
          explicit op_types_to_quantize=['MatMul', 'Gemm', 'Attention']
          so no Conv is quantized, plus a phone-compat op check (no
          ConvInteger / QLinearConv). Verified on test-bus.jpg:
          fp32/quantized parity, bus detected. See
          RFDETR_PROVENANCE.json for the full export record."
          git pull --rebase origin feature/native-onnx-app
          git push origin HEAD:feature/native-onnx-app
