name: native-android

# NOTE: gradlew loses its executable bit when pushed via the GitHub Contents
# API, hence the explicit chmod below. If gradlew is committed with mode
# 100755 (e.g. via a normal git push), the chmod is harmless.

on:
  push:
    branches: [feature/native-onnx-app]
    paths:
      - "native/**"
      - ".github/workflows/native-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-inference-native-debug
          path: native/app/build/outputs/apk/debug/app-debug.apk
