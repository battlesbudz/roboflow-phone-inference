name: publish-prerelease-asset

# One-off helper: attach a CI artifact to an existing prerelease.
# Dispatch-only -- never runs on push. Used because direct uploads to
# uploads.github.com are not possible with the API credential available
# outside Actions (401); inside Actions, GITHUB_TOKEN can upload.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Actions run ID holding the artifact"
        required: true
      artifact_name:
        description: "Artifact name to download"
        required: true
      tag:
        description: "Release tag to attach the asset to (must already exist)"
        required: true
      asset_name:
        description: "Name for the uploaded asset file"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.run_id }}" -n "${{ inputs.artifact_name }}" -D artifact
          ls -la artifact/
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=$(ls artifact/*.apk | head -n 1)
          echo "Uploading $FILE as ${{ inputs.asset_name }} to ${{ inputs.tag }}"
          cp "$FILE" "./${{ inputs.asset_name }}"
          gh release upload "${{ inputs.tag }}" "./${{ inputs.asset_name }}" --clobber
